<!DOCTYPE html>
<html lang="en">

<head>

<!-- Character encoding -->
<meta charset="UTF-8">

<!-- Mobile responsiveness -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tabsway Kitchen</title>

<!-- Main stylesheet -->
<link rel="stylesheet" href="style.css">

<!-- FontAwesome icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- Animated background gradient -->
<div class="background-animation"></div>

<!-- Floating bubbles -->
<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>
<div class="bubble b5"></div>

<!-- Main page container -->
<div class="container">

<!-- Restaurant Logo -->
<img src="logo-v2.png" class="logo">

<!-- Welcome text -->
<h1>Welcome to Tabsway Kitchen</h1>

<p class="subtitle">
Explore Our Menu & Connect With Us
</p>

<!-- Buttons area -->
<div class="social-buttons">

<!-- MENU BUTTON -->
<!-- This links to your existing menu website -->
<a href="https://tabswaykitchen.com/" class="btn menu" target="_blank">
<i class="fa-solid fa-utensils"></i>
View Our Menu AND ORDER
</a>

<!-- Instagram -->
<a href="https://instagram.com/tabsway" class="btn instagram" target="_blank">
<i class="fa-brands fa-instagram"></i>
Follow our Instagram
</a>

<!-- TikTok -->
<a href="https://tiktok.com/@tabsway" class="btn tiktok" target="_blank">
<i class="fa-brands fa-tiktok"></i>
Follow us on TikTok
</a>

<!-- Facebook -->
<a href="https://facebook.com/tabsway" class="btn facebook" target="_blank">
<i class="fa-brands fa-facebook"></i>
Like our Facebook Page
</a>

<!-- Google review -->
<a href="https://g.page/YOUR_GOOGLE_PLACE_ID/review" class="btn google" target="_blank">
<i class="fa-solid fa-star"></i>
Leave a Google Review
</a>

</div>

<!-- Review promotion box -->
<div class="review-promo">

⭐ Leave a Google review and show it to staff  
to receive <b>5% OFF your next purchase</b>

</div>

</div>

</body>
</html>
